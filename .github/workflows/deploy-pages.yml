name: Deploy Narcissu Persian Edition to GitHub Pages

on:
  workflow_dispatch:
    inputs:
      distribution_rights_confirmed:
        description: "Confirm that written permission covers public distribution of the bilingual game and every included story, translation, image, music and sound asset."
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    # The workflow deliberately does nothing unless the operator explicitly confirms
    # that public distribution rights have been secured.
    if: inputs.distribution_rights_confirmed == true
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out deployment repository
        uses: actions/checkout@v6

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      # Recover the Increment 47 mobile derivatives from either the intended source
      # path or the two misplaced paths encountered during earlier uploads.
      - name: Ensure mobile artwork is in the source tree
        shell: bash
        run: |
          set -euo pipefail
          correct="public/mobile-assets"

          if [ -d "$correct/portrait" ] && [ -d "$correct/landscape" ]; then
            echo "Mobile artwork is already in the correct source location."
          else
            mkdir -p "$correct"
            recovered=false
            for candidate in \
              "public/assets/mobile-assets" \
              "site/public/assets/mobile-assets" \
              "site/public/mobile-assets"; do
              if [ -d "$candidate" ]; then
                cp -a "$candidate/." "$correct/"
                recovered=true
                echo "Recovered mobile artwork from $candidate"
              fi
            done
            if [ "$recovered" != true ]; then
              echo "::error::Could not find the mobile artwork folder in the repository."
              exit 1
            fi
          fi

          test -d "$correct/portrait"
          test -d "$correct/landscape"
          echo "Portrait and landscape artwork are ready for the build."

      # Build outside the checked-out repository because the builder intentionally
      # refuses to write its output inside the source tree.
      - name: Build GitHub Pages payload
        run: python tools/build_github_pages_site.py --output "${{ runner.temp }}/narcissu-pages-site"

      - name: Verify the built static payload
        run: |
          python tools/verify_github_pages_site.py "${{ runner.temp }}/narcissu-pages-site"
          node --check "${{ runner.temp }}/narcissu-pages-site/app.js"
          node --check "${{ runner.temp }}/narcissu-pages-site/service-worker.js"

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ runner.temp }}/narcissu-pages-site
          include-hidden-files: true

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
