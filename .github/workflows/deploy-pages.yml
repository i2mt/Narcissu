name: Deploy Narcissu Persian Edition to GitHub Pages

on:
  workflow_dispatch:
    inputs:
      distribution_rights_confirmed:
        description: "Confirm that written permission covers public distribution of the bilingual game and every included story, translation, image, music and sound asset."
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    # The workflow deliberately does nothing unless the operator explicitly confirms
    # that public distribution rights have been secured.
    if: inputs.distribution_rights_confirmed == true
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out deployment repository
        uses: actions/checkout@v6

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      # The current repository has mobile artwork at:
      # site/public/assets/mobile-assets/
      # The app and verifier expect it at:
      # site/public/mobile-assets/
      - name: Normalize mobile artwork directory
        shell: bash
        run: |
          set -euo pipefail

          misplaced="site/public/assets/mobile-assets"
          correct="site/public/mobile-assets"

          if [ -d "$misplaced" ]; then
            mkdir -p "$correct"
            cp -a "$misplaced/." "$correct/"
            rm -rf "$misplaced"
            echo "Moved mobile artwork into $correct"
          elif [ -d "$correct" ]; then
            echo "Mobile artwork is already in the correct location."
          else
            echo "::error::Mobile artwork folder was not found at either $misplaced or $correct"
            exit 1
          fi

          test -d "$correct/portrait"
          test -d "$correct/landscape"
          echo "Portrait and landscape folders are present."

      - name: Verify the static payload
        run: |
          python tools/verify_github_pages_site.py site
          node --check site/app.js
          node --check site/service-worker.js

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site
          include-hidden-files: true

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
